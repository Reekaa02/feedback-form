<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form - MDS4143 Assignment 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .form-container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #d500f9;
            margin-bottom: 30px;
            font-size: 28px;
        }
       
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        .required::after {
            content: " *";
            color: #d93025;      
            font-weight: bold;
        }

        input[type="text"], input[type="email"], input[type="date"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea { resize: vertical; }

        .option-group {
            margin: 15px 0;
        }
        .option-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .option-group input[type="radio"],
        .option-group input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .error {
            color: #d93025;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .buttons {
            margin-top: 30px;
            text-align: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 10px;
        }
        button[type="submit"] {
            background-color: #ff00d4;
            color: white;
        }
        button[type="reset"] {
            background-color: #dadce0;
            color: #3c4043;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="form-container">
    <h1>Feedback Form</h1>
    <form id="feedbackForm" novalidate>

        <label class="required" for="fullName">Full Name</label>
        <input type="text" id="fullName" required>
        <div class="error" id="fullNameError">This field is required.</div>

        <label class="required" for="email">Email Address</label>
        <input type="email" id="email" required>
        <div class="error" id="emailError">Please enter a valid email address.</div>

        <label class="required" for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="e.g. 6010848299 or 012-3456789" required>
        <div class="error" id="phoneError">Invalid phone number. Use format like 012-3456789</div>

        <label class="required" for="ic">Malaysian IC Number</label>
        <input type="text" id="ic" placeholder="e.g. 990101-14-1234" required>
        <div class="error" id="icError">Invalid IC number. Format: YYMMDD-XX-XXXX</div>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob">
        <div class="error" id="dobError"></div>

        <label class="required">Gender</label>
        <div class="option-group">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>
        <div class="error" id="genderError">Please select your gender.</div>

        <label class="required" for="feedback">Your Feedback</label>
        <textarea id="feedback" rows="5" required></textarea>
        <div class="error" id="feedbackError">This field is required.</div>

        <div class="option-group">
            <label><input type="checkbox" id="terms" required> I agree to the Terms and Conditions</label>
        </div>
        <div class="error" id="termsError">You must agree to the terms.</div>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Clear Form</button>
        </div>
    </form>
</div>

<script>
    const form = document.getElementById('feedbackForm');


    const phoneRegex = /^\d{2,4}-?\d{7,8}$/;
    const icRegex = /^\d{6}-\d{2}-\d{4}$/;
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function showError(id, message) {
        const el = document.getElementById(id);
        el.textContent = message;
        el.style.display = 'block';
    }
    function hideError(id) {
        document.getElementById(id).style.display = 'none';
    }


    document.getElementById('phone').addEventListener('blur', () => {
        const val = document.getElementById('phone').value.trim();
        if (!val) showError('phoneError', 'This field is required.');
        else if (!phoneRegex.test(val)) showError('phoneError', 'Invalid phone number. Use format like 012-3456789');
        else hideError('phoneError');
    });

    document.getElementById('ic').addEventListener('blur', () => {
        const val = document.getElementById('ic').value.trim();
        if (!val) showError('icError', 'This field is required.');
        else if (!icRegex.test(val)) showError('icError', 'Invalid IC number. Format: YYMMDD-XX-XXXX');
        else hideError('icError');
    });

   
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        let valid = true;

        if (!document.getElementById('fullName').value.trim()) { showError('fullNameError', 'This field is required.'); valid = false; } else hideError('fullNameError');
        const email = document.getElementById('email').value.trim();
        if (!email) { showError('emailError', 'This field is required.'); valid = false; }
        else if (!emailRegex.test(email)) { showError('emailError', 'Please enter a valid email address.'); valid = false; }
        else hideError('emailError');

        const phone = document.getElementById('phone').value.trim();
        if (!phone) { showError('phoneError', 'This field is required.'); valid = false; }
        else if (!phoneRegex.test(phone)) { showError('phoneError', 'Invalid phone number. Use format like 012-3456789'); valid = false; }
        else hideError('phoneError');

        const ic = document.getElementById('ic').value.trim();
        if (!ic) { showError('icError', 'This field is required.'); valid = false; }
        else if (!icRegex.test(ic)) { showError('icError', 'Invalid IC number. Format: YYMMDD-XX-XXXX'); valid = false; }
        else hideError('icError');

        if (!document.querySelector('input[name="gender"]:checked')) { showError('genderError', 'Please select your gender.'); valid = false; } else hideError('genderError');
        if (!document.getElementById('feedback').value.trim()) { showError('feedbackError', 'This field is required.'); valid = false; } else hideError('feedbackError');
        if (!document.getElementById('terms').checked) { showError('termsError', 'You must agree to the terms.'); valid = false; } else hideError('termsError');

        if (valid) {
            alert('Thank you! Your feedback has been submitted successfully.');
            form.reset();
        }
    });
</script>

</body>
</html>
